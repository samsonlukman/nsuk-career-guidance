databases:
  - name: nsuk-career-db
    plan: free
    databaseName: nsuk_career
    user: nsuk

services:
  - type: web
    name: nsuk-career
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nsuk-career-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        value: supervisor.admin@example.com
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
